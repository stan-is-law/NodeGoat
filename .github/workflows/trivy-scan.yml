name: Trivy Scan

on:
  workflow_dispatch:

jobs:
  security:
    runs-on: ubuntu-latest

    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Dieses Gate blockiert den Job nur bei kritischen Schwachstellen,
      # für die bereits eine korrigierte Paketversion verfügbar ist.
      - name: Run Trivy (block on fixable CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          scanners: 'vuln'
          format: 'table'
          severity: 'CRITICAL'
          ignore-unfixed: true
          exit-code: '1'

      - name: Run Trivy (SARIF)
        uses: aquasecurity/trivy-action@v0.36.0
        if: always()
        with:
          scan-type: 'fs'
          scan-ref: '.'
          scanners: 'vuln'
          format: 'sarif'
          severity: 'CRITICAL'
          ignore-unfixed: true
          exit-code: '0'
          output: 'trivy-results.sarif'
          skip-setup-trivy: true

      - name: Upload to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
